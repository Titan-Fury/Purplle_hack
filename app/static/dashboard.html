<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apex Store Intelligence — Live</title>
<style>
  :root { --bg:#0e1117; --card:#171c26; --line:#232a36; --muted:#8b97a7;
          --ok:#22c55e; --warn:#f59e0b; --crit:#ef4444; --accent:#6366f1; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:#e6edf3; }
  header { display:flex; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  .live { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; margin-left:auto; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%{opacity:1} 50%{opacity:.3} 100%{opacity:1} }
  input { background:var(--card); border:1px solid var(--line); color:#e6edf3; padding:6px 10px; border-radius:8px; }
  main { padding:24px; display:grid; gap:20px; max-width:1100px; margin:0 auto; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .kpi .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .kpi .value { font-size:30px; font-weight:700; margin-top:6px; }
  h2 { font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:0 0 12px; }
  .bar { display:flex; align-items:center; gap:10px; margin:8px 0; font-size:14px; }
  .bar .name { width:130px; color:#cbd5e1; }
  .track { flex:1; background:#0b0f16; border-radius:6px; overflow:hidden; height:22px; }
  .fill { height:100%; background:linear-gradient(90deg,var(--accent),#8b5cf6); }
  .bar .num { width:90px; text-align:right; color:var(--muted); }
  .anomaly { display:flex; gap:10px; align-items:flex-start; padding:10px; border-radius:8px; margin:8px 0; background:#0b0f16; }
  .sev { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .INFO{background:#1e293b;color:#93c5fd} .WARN{background:#3b2f12;color:var(--warn)} .CRITICAL{background:#3b1212;color:var(--crit)}
  .badge { padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .LIVE{background:#0f2a18;color:var(--ok)} .STALE_FEED{background:#3b2f12;color:var(--warn)}
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Apex Store Intelligence</h1>
  <span class="muted">store</span>
  <input id="store" value="ST1008" />
  <input id="date" placeholder="YYYY-MM-DD (optional)" />
  <span class="live"><span class="dot"></span><span id="tick">connecting…</span></span>
</header>
<main>
  <div class="kpis" id="kpis"></div>
  <div class="card"><h2>Conversion Funnel</h2><div id="funnel"></div></div>
  <div class="card"><h2>Zone Heatmap (dwell)</h2><div id="heatmap"></div></div>
  <div class="card"><h2>Active Anomalies</h2><div id="anomalies"></div></div>
  <div class="card"><h2>Feed Health</h2><div id="health"></div></div>
</main>
<script>
const $ = id => document.getElementById(id);
const pct = x => (x*100).toFixed(1) + '%';

function kpi(label, value){ return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div></div>`; }

async function getJSON(path){ const r = await fetch(path); if(!r.ok) throw new Error(r.status); return r.json(); }

async function refresh(){
  const store = $('store').value.trim() || 'STORE_BLR_002';
  const d = $('date').value.trim();
  const q = d ? `?date=${d}` : '';
  try {
    const [m, f, h, a] = await Promise.all([
      getJSON(`/stores/${store}/metrics${q}`),
      getJSON(`/stores/${store}/funnel${q}`),
      getJSON(`/stores/${store}/heatmap${q}`),
      getJSON(`/stores/${store}/anomalies${q}`),
    ]);

    $('kpis').innerHTML =
      kpi('Unique Visitors', m.unique_visitors) +
      kpi('Conversion Rate', pct(m.conversion_rate)) +
      kpi('Purchases', m.purchases) +
      kpi('Queue Depth', m.queue_depth.current + ' / ' + m.queue_depth.max) +
      kpi('Abandonment', pct(m.abandonment_rate));

    const maxC = Math.max(...f.stages.map(s=>s.count), 1);
    $('funnel').innerHTML = f.stages.map(s =>
      `<div class="bar"><span class="name">${s.stage}</span>
        <span class="track"><span class="fill" style="width:${100*s.count/maxC}%"></span></span>
        <span class="num">${s.count} (-${s.drop_off_pct}%)</span></div>`).join('');

    const conf = h.data_confidence === 'LOW' ? ' <span class="muted">(low confidence: '+h.session_count+' sessions)</span>' : '';
    $('heatmap').innerHTML = h.zones.map(z =>
      `<div class="bar"><span class="name">${z.zone_id}</span>
        <span class="track"><span class="fill" style="width:${z.avg_dwell_norm}%"></span></span>
        <span class="num">${(z.avg_dwell_ms/1000).toFixed(1)}s</span></div>`).join('') + conf;

    $('anomalies').innerHTML = a.anomalies.length
      ? a.anomalies.map(x => `<div class="anomaly"><span class="sev ${x.severity}">${x.severity}</span>
          <div><b>${x.type}</b><div class="muted">${x.suggested_action}</div></div></div>`).join('')
      : '<div class="muted">No active anomalies.</div>';

    const hs = await getJSON('/health');
    const st = (hs.stores||[]).find(s => s.store_id === store);
    $('health').innerHTML = st
      ? `<span class="badge ${st.feed}">${st.feed}</span> <span class="muted">last event: ${st.last_event||'—'} (${st.lag_seconds??'—'}s ago)</span>`
      : '<span class="muted">No feed data.</span>';

    $('tick').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    $('tick').textContent = 'error: ' + e.message;
  }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
